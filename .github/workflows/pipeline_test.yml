name: Smart Momentum Pipeline

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Simulation Cut-off Date (YYYY-MM-DD)'
        required: true
        default: '2025-07-11'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONUNBUFFERED: 1
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Debug - Show Directory Structure
      run: |
        echo "=== Current Directory ==="
        pwd
        echo ""
        echo "=== Files in Repository Root ==="
        ls -la
        echo ""
        echo "=== Looking for src directory ==="
        if [ -d "src" ]; then
          echo "✓ src/ EXISTS"
          echo ""
          echo "Contents of src/:"
          ls -la src/
          echo ""
          echo "Looking for stock_signals in src/:"
          find src/ -type d -name "stock_signals" 2>/dev/null
          echo ""
          echo "Looking for cli.py:"
          find . -name "cli.py" 2>/dev/null
        else
          echo "✗ src/ DOES NOT EXIST"
          echo ""
          echo "Searching for stock_signals anywhere:"
          find . -type d -name "stock_signals" 2>/dev/null
          echo ""
          echo "Searching for cli.py anywhere:"
          find . -name "cli.py" 2>/dev/null
        fi
        echo ""
        echo "=== PYTHONPATH ==="
        echo $PYTHONPATH
        echo ""
        echo "=== Python sys.path ==="
        python -c "import sys; print('\n'.join(sys.path))"
        echo ""
        echo "=== Trying to import stock_signals ==="
        python -c "import stock_signals; print('SUCCESS:', stock_signals.__file__)" || echo "FAILED: stock_signals not found"

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Try Import After Install
      run: |
        python -c "import stock_signals; print('SUCCESS after pip install:', stock_signals.__file__)" || echo "STILL FAILED"
